[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-lead-engine"
version = "0.1.0"
description = "Modular lead sourcing, scoring, outreach, and commission tracking framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = ["leads", "real-estate", "crm", "commission", "scoring", "outreach"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Customer Service",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
ai = ["ollama>=0.1"]
scraping = ["selenium>=4.0", "playwright>=1.40"]
reports = ["reportlab>=4.0"]
dev = ["pytest>=7.0", "black>=24.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_lead_engine*"]

[tool.ruff]
line-length = 100
target-version = "py39"